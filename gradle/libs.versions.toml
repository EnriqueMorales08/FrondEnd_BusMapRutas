[versions]
androidGradlePlugin = "8.2.0"
fragmentKtx = "1.8.8"
kotlin = "2.0.21"

coreKtx = "1.12.0"
appcompat = "1.7.0"
lifecycleRuntimeKtxVersion = "2.6.1"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"

playServicesLocation = "21.3.0"
